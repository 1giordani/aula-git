<text x="80" y="240" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">PK id_pedido</text>
<text x="80" y="267" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">FK id_cliente</text>
<text x="80" y="294" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">data_criacao, status</text>
<text x="80" y="321" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">endereco_entrega_snapshot</text>
<text x="80" y="348" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">frete, desconto</text>
<rect x="600" y="140" width="360" height="260" rx="10" fill="#1a2029" stroke="#a99576" stroke-width="1.5"/>
