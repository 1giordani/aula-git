<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">Pedidos, produtos e vendedores</title><desc id="desc">Itens guardam o preço histórico; o total é calculado em vw_total_pedido e o saldo em vw_saldo_pedido.</desc>
