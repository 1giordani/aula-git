<text x="620" y="247" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">PK numero_item</text>
<text x="620" y="274" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">FK id_oferta</text>
<text x="620" y="301" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">quantidade</text>
<text x="620" y="328" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">preco_unitario_praticado</text>
<text x="620" y="355" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">subtotal DECIMAL GENERATED</text>
<rect x="1120" y="130" width="360" height="270" rx="10" fill="#1a2029" stroke="#a99576" stroke-width="1.5"/>
<text x="1140" y="163" font-size="19" fill="#ebc17d" text-anchor="start" font-weight="bold">OFERTA</text>
