<text x="1140" y="800" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">PK id_produto</text>
<text x="1140" y="827" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">descricao</text>
<text x="1140" y="854" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">categoria</text>
<rect x="590" y="720" width="390" height="190" rx="10" fill="#1a2029" stroke="#a99576" stroke-width="1.5"/>
<text x="610" y="753" font-size="19" fill="#ebc17d" text-anchor="start" font-weight="bold">VENDEDOR</text>
<line x1="590" y1="770" x2="980" y2="770" stroke="#a99576"/>
<text x="610" y="800" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">PK id_vendedor</text>
<text x="610" y="827" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">nome, UK cnpj</text>
<text x="610" y="854" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">tipo ENUM (PLATAFORMA | TERCEIRO)</text>
<text x="60" y="1122" font-size="17" fill="#ebc17d" text-anchor="start" font-weight="normal">Pedido em rascunho pode ter 0 itens; pedido confirmado deve conter 1 ou mais. Quantidade &gt; 0.</text>
<text x="60" y="1155" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">PK = chave primária   |   FK = chave estrangeira   |   UK = chave única   |   0..N = zero ou muitos   |   0..1 = opcional</text>
<text x="1530" y="1155" font-size="15" fill="#eae2d4" text-anchor="end" font-weight="normal">Giordani Martins Silva</text>
</g></svg>