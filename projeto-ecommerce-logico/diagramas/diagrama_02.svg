<text x="1140" y="210" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">PK id_oferta</text>
<text x="1140" y="237" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">FK id_produto</text>
<text x="1140" y="264" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">FK id_vendedor</text>
<text x="1140" y="291" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">preco_atual, ativo</text>
<text x="1140" y="318" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">UK (id_produto, id_vendedor)</text>
<rect x="1120" y="720" width="360" height="190" rx="10" fill="#1a2029" stroke="#a99576" stroke-width="1.5"/>
<text x="1140" y="753" font-size="19" fill="#ebc17d" text-anchor="start" font-weight="bold">PRODUTO</text>
