<text x="580" y="143" font-size="19" fill="#ebc17d" text-anchor="start" font-weight="bold">CLIENTE</text>
<line x1="560" y1="160" x2="940" y2="160" stroke="#a99576"/>
<text x="580" y="190" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">PK id_cliente INT UNSIGNED</text>
<text x="580" y="217" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">tipo_cliente ENUM (PF | PJ)</text>
<text x="580" y="244" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">nome_exibicao, email</text>
<text x="580" y="271" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">atributos PF ou PJ (CHECK XOR)</text>
<text x="580" y="314" font-size="14" fill="#ebc17d" text-anchor="start" font-weight="normal">Tipos completos e regra no dicionário</text>
<rect x="60" y="130" width="320" height="180" rx="10" fill="#1a2029" stroke="#a99576" stroke-width="1.5"/>
<text x="80" y="163" font-size="19" fill="#ebc17d" text-anchor="start" font-weight="bold">VW_CLIENTE_PF (VIEW)</text>
<line x1="60" y1="180" x2="380" y2="180" stroke="#a99576"/>
<text x="80" y="210" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">id_cliente (projeção da conta PF)</text>
<text x="80" y="237" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">cpf</text>
<text x="80" y="264" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">nome_completo</text>
<rect x="1120" y="130" width="320" height="180" rx="10" fill="#1a2029" stroke="#a99576" stroke-width="1.5"/>
<text x="1140" y="163" font-size="19" fill="#ebc17d" text-anchor="start" font-weight="bold">VW_CLIENTE_PJ (VIEW)</text>
<line x1="1120" y1="180" x2="1440" y2="180" stroke="#a99576"/>
<text x="1140" y="210" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">id_cliente (projeção da conta PJ)</text>
<text x="1140" y="237" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">cnpj</text>
<text x="1140" y="264" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">razao_social</text>
<rect x="70" y="510" width="380" height="220" rx="10" fill="#1a2029" stroke="#a99576" stroke-width="1.5"/>
<text x="90" y="543" font-size="19" fill="#ebc17d" text-anchor="start" font-weight="bold">PEDIDO</text>
