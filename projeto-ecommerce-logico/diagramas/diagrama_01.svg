<text x="90" y="590" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">PK id_pedido</text>
<text x="90" y="617" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">FK id_cliente</text>
<text x="90" y="644" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">data_criacao, status</text>
<text x="90" y="671" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">endereco_entrega_snapshot</text>
<text x="90" y="698" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">frete, desconto</text>
<rect x="1060" y="510" width="380" height="220" rx="10" fill="#1a2029" stroke="#a99576" stroke-width="1.5"/>
<text x="1080" y="543" font-size="19" fill="#ebc17d" text-anchor="start" font-weight="bold">FORMA_PAGAMENTO</text>
<line x1="1060" y1="560" x2="1440" y2="560" stroke="#a99576"/>
<text x="1080" y="590" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">PK id_forma</text>
<text x="1080" y="617" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">FK id_cliente</text>
<text x="1080" y="644" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">tipo ENUM (CARTAO | PIX | BOLETO)</text>
<text x="1080" y="671" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">apelido / referencia_provedor</text>
<rect x="650" y="810" width="380" height="240" rx="10" fill="#1a2029" stroke="#a99576" stroke-width="1.5"/>
<text x="670" y="843" font-size="19" fill="#ebc17d" text-anchor="start" font-weight="bold">PAGAMENTO</text>
<line x1="650" y1="860" x2="1030" y2="860" stroke="#a99576"/>
<text x="670" y="890" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">PK id_pagamento</text>
<text x="670" y="917" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">FK id_pedido (composta)</text>
<text x="670" y="944" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">FK id_forma (composta)</text>
<text x="670" y="971" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">FK id_cliente (mesmo titular)</text>
<text x="670" y="998" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">valor, status</text>
<text x="670" y="1025" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">data_pagamento (condicional)</text>
<rect x="70" y="860" width="430" height="210" rx="10" fill="#1a2029" stroke="#a99576" stroke-width="1.5"/>
<text x="90" y="893" font-size="19" fill="#ebc17d" text-anchor="start" font-weight="bold">ENTREGA</text>
<line x1="70" y1="910" x2="500" y2="910" stroke="#a99576"/>
<text x="90" y="940" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">PK id_entrega</text>
<text x="90" y="967" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">UK, FK id_pedido</text>
<text x="90" y="994" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">status, transportadora</text>
<text x="90" y="1021" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">codigo_rastreio (condicional)</text>
<text x="90" y="1048" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">UK (transportadora, codigo_rastreio)</text>
<text x="60" y="1122" font-size="17" fill="#ebc17d" text-anchor="start" font-weight="normal">Regras: PF XOR PJ; a forma usada pertence ao cliente do pedido; rastreio obrigatório após postagem.</text>
<text x="60" y="1155" font-size="16" fill="#eae2d4" text-anchor="start" font-weight="normal">PK = chave primária   |   FK = chave estrangeira   |   UK = chave única   |   0..N = zero ou muitos   |   0..1 = opcional</text>
<text x="1530" y="1155" font-size="15" fill="#eae2d4" text-anchor="end" font-weight="normal">Giordani Martins Silva</text>
